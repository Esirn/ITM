name: hymotion
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.1
  - mkl<2025
  - intel-openmp<2025
  - pip:
      - -e .
      - huggingface-hub<1.0
      - torchdiffeq==0.2.5
      - accelerate==0.30.1
      - diffusers==0.26.3
      - transformers==4.53.3
      - einops==0.8.1
      - safetensors==0.5.3
      - bitsandbytes==0.49.0
      - scipy>=1.10.0
      - transforms3d==0.4.2
      - PyYAML==6.0
      - omegaconf==2.3.0
      - click==8.1.3
      - requests==2.32.4
      - openai==1.78.1
